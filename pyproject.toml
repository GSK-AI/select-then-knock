# Tool configuration only: this workspace is run from source, not built or released.
[tool.pytest.ini_options]
testpaths = ["tests", "experiments/03-matched-aggregation/test_analysis.py", "experiments/04-pc-knockoff-comparison/tests"]
markers = ["reference: bounded comparisons against a separately supplied reference source"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
